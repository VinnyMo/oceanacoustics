name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-pil ffmpeg
      - run: OPENBLAS_NUM_THREADS=1 /usr/bin/python3 -m unittest discover -s tests -v
      - run: bash -n deploy/install.sh && node --check web/app.js && node --check web/globe.js
